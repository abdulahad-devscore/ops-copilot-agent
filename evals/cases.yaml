# 100 eval cases for the Ops Copilot.
#
# Fields: id, category (knowledge | erp_data | action | permission | out_of_scope), role, question,
# route (expected classifier route), docs (documents that answer it: used for retrieval hit@k and citation
# checks), must_include (each item must appear; a list item means any one of the alternatives),
# must_not_include, tools (must be called), proposal (expected propose_* tool + argument subset),
# status (completed | awaiting_approval), scoped (call the ERP with the user's own bridge token).
#
# ERP facts come from the deterministic seed (BUSINESS_DATE 2026-10-27). Regenerate with
# `python -m evals.snapshot_facts` if the seed changes.

