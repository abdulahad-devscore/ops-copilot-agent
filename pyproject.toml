[project]
name = "ops-copilot-agent"
version = "1.0.0"
description = "LangGraph operations agent: RAG over company documents + live ERP via MCP, with human approval before any write."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp==2.3.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary,pool]==3.3.6",
    "pgvector==0.5.1",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    "fastembed==0.9.1",
    "langfuse==5.0.4",
]

[project.optional-dependencies]
cohere = ["cohere==6.1.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.15.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "evals"]
markers = ["llm: calls the real model (needs ANTHROPIC_API_KEY and the running stack)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_corpus.py" = ["E501"]  # document text
"tests/test_live_bridge.py" = ["ASYNC210"]
