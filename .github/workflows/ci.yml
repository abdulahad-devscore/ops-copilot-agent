name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals scripts && ruff format --check src tests evals scripts
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests -rfE 2>&1 | tee pytest.log
      - name: Report test failures
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR)|^E  |^retrieval |^  miss " pytest.log | head -20 | sed "s/^/::error::/" || true

  retrieval-evals:
    # Deterministic, no API key: hit@5 / MRR over the eval questions with the real embedder + reranker,
    # plus the permission-leak check. Fails the PR if retrieval quality drops below the bar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/fastembed, key: fastembed-bge-small-minilm }
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -s evals/test_retrieval.py -rfE 2>&1 | tee pytest.log
        env: { EVAL_EMBEDDER: fastembed, FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed }
      - name: Report test failures
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR)|^E  |^retrieval |^  miss " pytest.log | head -20 | sed "s/^/::error::/" || true
      - uses: actions/upload-artifact@v4
        with: { name: retrieval-results, path: evals/results/retrieval-fastembed.json }
